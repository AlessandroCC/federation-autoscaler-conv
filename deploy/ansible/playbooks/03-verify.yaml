---
# 03-verify.yaml
#
# Asserts the federation is healthy and ready for the demo. Each step
# prints a small banner so the audience can follow along live. Failures
# fail the playbook with a clear message.

# Re-sync kubeconfigs first so a changed VM IP (inventory updated) doesn't
# make the kubectl checks below hang on the old address. Safe no-op when
# nothing changed.
- name: Refresh kubeconfigs from live nodes (handles changed VM IPs)
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Re-fetch {{ cluster_id }} kubeconfig with its current inventory IP
      ansible.builtin.include_role:
        name: k3s_install
        tasks_from: fetch_kubeconfig

# Clock drift is checked before the functional assertions because it
# invalidates measurements silently — the demo works perfectly with skewed
# clocks, and only the benchmark numbers come out wrong. Warn rather than
# fail: a skewed federation is still a working federation.
- name: Report clock offset on every host
  hosts: all
  gather_facts: false
  become: true
  tasks:

    - name: "[{{ cluster_id | default(inventory_hostname) }}] read chrony offset"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          chronyc tracking | awk -F':' '/System time/ {print $2}'
        executable: /bin/bash
      register: chrony_offset
      changed_when: false
      failed_when: false

    - name: "[{{ cluster_id | default(inventory_hostname) }}] clock offset"
      ansible.builtin.debug:
        msg: >-
          {{ cluster_id | default(inventory_hostname) }} system time {{ chrony_offset.stdout | default('unknown') | trim }}
          {{ '— WARNING: chrony not reachable; cross-cluster timings will be unreliable'
             if chrony_offset.rc | default(1) != 0 else '' }}

- name: Verify federation health
  hosts: central
  gather_facts: false
  become: false
  tasks:

    - name: "[central] Broker Deployment is Available"
      delegate_to: localhost
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig {{ cluster_kubeconfig }} -n {{ fa_namespace }} \
            get deploy broker -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
      register: broker_avail
      changed_when: false
      failed_when: broker_avail.stdout != "True"

    # Provider agents POST their first advertisement ~30 s after they start,
    # and the broker then flips Status.Available=true. On a cold deploy this
    # check can run before that lands, so retry for ~2 min instead of failing
    # on the first (empty) read.
    - name: "[central] At least one provider has a fresh ClusterAdvertisement"
      delegate_to: localhost
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig {{ cluster_kubeconfig }} -n {{ fa_namespace }} \
            get clusteradvertisements.broker.federation-autoscaler.io \
            -o jsonpath='{range .items[?(@.status.available==true)]}{.metadata.name} {end}'
      register: cadvs
      changed_when: false
      retries: 12
      delay: 10
      until: (cadvs.stdout | trim) != ""

    - name: "[central] OK — broker ready, providers advertising: {{ cadvs.stdout | trim }}"
      ansible.builtin.debug:
        msg: "broker ready; advertising providers = {{ cadvs.stdout | trim }}"

- name: Verify each consumer
  hosts: consumers
  gather_facts: false
  become: false
  tasks:

    - name: "[{{ cluster_id }}] Agent + grpc-server Deployments Available"
      delegate_to: localhost
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig {{ cluster_kubeconfig }} -n {{ fa_namespace }} \
            wait deploy/agent deploy/grpc-server --for=condition=Available --timeout=2m
      changed_when: false

    - name: "[{{ cluster_id }}] Cluster Autoscaler is Available"
      delegate_to: localhost
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig {{ cluster_kubeconfig }} -n {{ fa_namespace }} \
            wait deploy/cluster-autoscaler --for=condition=Available --timeout=2m
      changed_when: false

    - name: "[{{ cluster_id }}] OK"
      ansible.builtin.debug:
        msg: "{{ cluster_id }} ready — agent + grpc-server + CA up"

- name: Verify each provider
  hosts: providers
  gather_facts: false
  become: false
  tasks:

    - name: "[{{ cluster_id }}] Agent Deployment Available"
      delegate_to: localhost
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig {{ cluster_kubeconfig }} -n {{ fa_namespace }} \
            wait deploy/agent --for=condition=Available --timeout=2m
      changed_when: false

    - name: "[{{ cluster_id }}] OK"
      ansible.builtin.debug:
        msg: "{{ cluster_id }} ready — provider agent up, advertising capacity"
