consumers: 3
providers: 7

experiment:
  mode: reserve
  duration: time
  timer: 30m
  iterations: 15 # ignored while duration: time; kept as a fallback value
  phasePause: 35s
  policyPropagationWait: 35s
  advertisementLag: 35s

  latencyRefreshInterval: 30s
  # Simulated one-way delay per (consumer, provider) pair, redrawn from this
  # range on every refresh. The ceiling stays under the prober's 300ms
  # per-probe deadline, above which a provider reads as unreachable and its
  # RTT never reaches the CSVs.
  latencyMinMs: 30
  latencyMaxMs: 250

infra:
  readinessTimeout: 10m
  liqoProvider: kind

cleanup: true

output:
  dir: results
